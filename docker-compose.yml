services:
  postgres:
    image: postgres:16-alpine
    container_name: sip-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: sip_local
      POSTGRES_USER: sip_app
      POSTGRES_PASSWORD: sip_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip_app -d sip_local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

