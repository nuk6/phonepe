spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sip_qa
    username: sip_app
    password: ${DB_PASSWORD:changeme_qa}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

